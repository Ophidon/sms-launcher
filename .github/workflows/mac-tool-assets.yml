name: Publish Mac build tool archives
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Tool archive to publish
        type: choice
        default: all
        options: [all, x64, arm64]
permissions:
  contents: read
jobs:
  prepare-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        if: (inputs.arch == 'all' || inputs.arch == matrix.arch)
      - uses: actions/setup-node@v4
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
      - name: Check runner architecture
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
      - name: Enable Intel execution on the Apple Silicon CI runner
        if: (inputs.arch == 'all' || inputs.arch == matrix.arch) && matrix.arch == 'arm64'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - run: npm test
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
      - name: Package private tools and corresponding sources
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
        run: node scripts/package-build-tools.js
      # The game Beta builds: the newest commit on sms-pc-port's main (the
      # pinned release can be older than what the toolset must build).
      - name: Point the smoke test at the newest game
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(gh api repos/chasem-dev/sms-pc-port/commits/main --jq .sha)
          decomp=$(gh api "repos/chasem-dev/sms-pc-port/contents/decomp?ref=$commit" --jq .sha)
          COMMIT="$commit" DECOMP="$decomp" node -e 'const e = process.env; require("fs").writeFileSync("src/game-release.json",
            JSON.stringify({ version: "toolset-smoke", repository: "https://github.com/chasem-dev/sms-pc-port.git", branch: "main",
              commit: e.COMMIT, decomp: e.DECOMP }, null, 2))'
          cat src/game-release.json
      - name: Compile Sunshine using only relocated tools and the Apple SDK
        if: inputs.arch == 'all' || inputs.arch == matrix.arch
        run: node scripts/smoke-mac-tools.js
        env:
          SMS_TOOL_ASSET_MANIFEST: tool-assets/manifest-macos-${{ matrix.arch }}.json
          # the arm64 toolset also builds the Apple Silicon game, which it must
          SMS_SMOKE_ARCHES: ${{ matrix.arch == 'arm64' && '64,arm64' || '64' }}
          SMS_SMOKE_REQUIRE_ARM64: ${{ matrix.arch == 'arm64' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: (inputs.arch == 'all' || inputs.arch == matrix.arch) && always()
        with:
          name: tools-macos-${{ matrix.arch }}
          overwrite: true
          path: tool-assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: prepare-tools
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: tool-assets
          pattern: tools-macos-*
          merge-multiple: true
      - name: Publish immutable Mac toolset release
        run: node scripts/publish-tool-assets.js
        env:
          SMS_MAC_TOOL_ASSETS: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
